# Local development services (PostgreSQL + S3Mock). Start with:  docker compose up -d --wait
# Settings are read from the .env file next to this file (copy .env.example).
name: swiftdrop

services:
  postgres:
    # Keep this version in sync with backend TestcontainersConfiguration.
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-swiftdrop}
      POSTGRES_USER: ${DB_USERNAME:-swiftdrop}
      # Compose stops with this message if the password is missing.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in the .env file (copy .env.example to .env)}
    ports:
      # 127.0.0.1 = reachable only from this computer, not from your network.
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # Named volume: data survives "docker compose down" and restarts.
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Local stand-in for AWS S3 (product and category images). S3-compatible,
  # free, needs no AWS account. Real AWS S3 is configured separately (docs/AWS_SETUP.md).
  s3:
    # Keep this version in sync with backend TestcontainersConfiguration.
    image: adobe/s3mock:5.2.3
    environment:
      COM_ADOBE_TESTING_S3MOCK_STORE_INITIAL_BUCKETS: ${S3_BUCKET:-swiftdrop-images}
      # Keep uploaded files in the volume below, across restarts.
      COM_ADOBE_TESTING_S3MOCK_STORE_ROOT: /s3mockroot
      COM_ADOBE_TESTING_S3MOCK_STORE_RETAIN_FILES_ON_EXIT: "true"
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - s3-data:/s3mockroot
    restart: unless-stopped

volumes:
  postgres-data:
  s3-data:
