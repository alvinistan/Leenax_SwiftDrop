spring:
  application:
    name: swiftdrop-backend

  # Local settings (database password etc.) come from the .env file in the
  # repository root, which is git-ignored. Both paths are listed so the app
  # works whether it is started from the repo root or from backend/.
  # Real environment variables always override values from .env.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swiftdrop}
    username: ${DB_USERNAME:swiftdrop}
    # No default on purpose: a password must never be committed to Git.
    password: ${DB_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Keep database access inside the service layer, not the HTTP view.
    open-in-view: false
    properties:
      hibernate:
        # Load lazy collections (e.g. variants of 20 products) in batches
        # instead of one query per product.
        default_batch_fetch_size: 50

  data:
    web:
      pageable:
        # Clients cannot ask for huge pages (?size=1000000).
        max-page-size: 100

  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}

# OpenAPI JSON at /v3/api-docs and Swagger UI at /swagger-ui.html.
# Enabled for local development; set API_DOCS_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint over HTTP.
        include: health
  endpoint:
    health:
      # Shows "db: UP" etc. without connection details.
      show-components: always
