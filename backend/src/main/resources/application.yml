spring:
  application:
    name: swiftdrop-backend

  # Local settings (database password etc.) come from the .env file in the
  # repository root, which is git-ignored. Both paths are listed so the app
  # works whether it is started from the repo root or from backend/.
  # Real environment variables always override values from .env.
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:../.env[.properties]

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:swiftdrop}
    username: ${DB_USERNAME:swiftdrop}
    # No default on purpose: a password must never be committed to Git.
    password: ${DB_PASSWORD}

  jpa:
    # Flyway owns the schema. Hibernate only checks that entities match it.
    hibernate:
      ddl-auto: validate
    # Keep database access inside the service layer, not the HTTP view.
    open-in-view: false
    properties:
      hibernate:
        # Load lazy collections (e.g. variants of 20 products) in batches
        # instead of one query per product.
        default_batch_fetch_size: 50

  servlet:
    multipart:
      # Largest image we accept (anything bigger gets HTTP 413).
      max-file-size: 5MB
      max-request-size: 6MB

  data:
    web:
      pageable:
        # Clients cannot ask for huge pages (?size=1000000).
        max-page-size: 100

  flyway:
    locations: classpath:db/migration

server:
  port: ${SERVER_PORT:8080}
  # Behind a load balancer / reverse proxy (Phase 14) set FORWARD_HEADERS_STRATEGY=native,
  # so the client's real IP is used for rate limits. Never on a server exposed directly.
  forward-headers-strategy: ${FORWARD_HEADERS_STRATEGY:none}
  # Smaller JSON over slow mobile connections.
  compression:
    enabled: true
    mime-types: application/json,application/problem+json
    min-response-size: 2KB
  servlet:
    session:
      # Log out automatically after 2 hours without activity.
      timeout: 2h
      cookie:
        # JavaScript cannot read the session cookie (protects it from injected scripts).
        http-only: true
        # Not sent when another website starts the request (extra CSRF defence).
        same-site: lax
        # true = only sent over HTTPS. Must be true in production (Phase 14).
        secure: ${SESSION_COOKIE_SECURE:false}

app:
  storage:
    s3:
      # Product and category images. Local development uses S3Mock (docker compose);
      # leave S3_ENDPOINT empty to use real AWS S3 (see docs/AWS_SETUP.md).
      bucket: ${S3_BUCKET:swiftdrop-images}
      region: ${AWS_REGION:ap-south-1}
      endpoint: ${S3_ENDPOINT:}
      # Optional AWS CLI profile for real AWS on your PC (never put keys here).
      profile: ${AWS_PROFILE_NAME:}
      # How long an image link stays valid.
      url-expiry: 1h
  admin:
    # The first administrator, created at startup if none exists (see AdminProvisioner).
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
  cors:
    # Browser origins allowed to call /api/** (comma-separated). The Vite dev
    # server runs on http://localhost:5173. Set the real site URL in production.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    # Requests per client IP address (docs/SECURITY.md). Bursts up to "requests",
    # refilled evenly over "per". Over the limit: 429 Too Many Requests.
    enabled: ${RATE_LIMIT_ENABLED:true}
    login: { requests: 10, per: 1m }
    register: { requests: 5, per: 1h }
    quotes: { requests: 30, per: 1m }
    cart-price: { requests: 60, per: 1m }
    checkout: { requests: 10, per: 1m }
    payment-notify: { requests: 60, per: 1m }
    # Every /api/** request together
    api: { requests: 300, per: 1m }
    # After this many wrong passwords for one email (within lock-duration), that
    # email is locked for lock-duration.
    max-failed-logins: 5
    lock-duration: 15m
  payhere:
    # Online card payments (master Phase 9). Card payment is offered only when
    # merchant id, merchant secret and the public API address are all set.
    # NEVER commit the secret: put it in .env (local) or a secrets manager.
    merchant-id: ${PAYHERE_MERCHANT_ID:}
    merchant-secret: ${PAYHERE_MERCHANT_SECRET:}
    # sandbox (testing) or live
    mode: ${PAYHERE_MODE:sandbox}
    # Public https address of THIS backend, so PayHere can send payment
    # notifications (not localhost). E.g. https://api.swiftdrop.lk
    public-api-base-url: ${PAYHERE_PUBLIC_API_BASE_URL:}
    # The shop's address in the browser (for return/cancel links)
    frontend-base-url: ${FRONTEND_BASE_URL:http://localhost:5173}
    # Card orders not paid within this time are cancelled and their stock returned
    unpaid-timeout: ${PAYHERE_UNPAID_TIMEOUT:PT2H}

# OpenAPI JSON at /v3/api-docs and Swagger UI at /swagger-ui.html.
# Enabled for local development; set API_DOCS_ENABLED=false in production.
springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:true}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:true}
    # Let "Try it out" send the CSRF token, so admin requests work after logging in.
    csrf:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        # Expose only the health endpoint over HTTP.
        include: health
  endpoint:
    health:
      # Shows "db: UP" etc. without connection details.
      show-components: always
